.progress-fill { height: 100%; width: 0%; background: #4caf50; text-align: center; color: white; font-size: 12px; line-height: 18px; transition: width 0.5s, background 0.5s; }

// Función para agregar todos los participantes de la lista
function addAllParticipants() {
  participantesLista.forEach(nombre => addRow(nombre));
  updateTotals();
}
// Función para agregar un participante con ID único en Firestore
function addRow(nombre="", asistencia="", fechas=[false,false,false,false], id=null){
  const tbody = document.getElementById("tableBody");
  const newRow = tbody.insertRow();
  
  // Si no hay ID, generamos uno único de Firestore
  const rowId = id || db.collection("participantes").doc().id;
  newRow.dataset.id = rowId;

  newRow.innerHTML = `
    <td>0</td>
    <td><input type="text" value="${nombre}" oninput="guardarFila(this)"></td>
    <td>
      <select onchange="guardarFila(this)">
        <option value="">--</option>
        <option value="Sí" ${asistencia==='Sí'?'selected':''}>Sí</option>
        <option value="No" ${asistencia==='No'?'selected':''}>No</option>
      </select>
    </td>
    <td><input type="checkbox" ${fechas[0]?'checked':''} disabled onchange="guardarFila(this)"></td>
    <td><input type="checkbox" ${fechas[1]?'checked':''} disabled onchange="guardarFila(this)"></td>
    <td><input type="checkbox" ${fechas[2]?'checked':''} disabled onchange="guardarFila(this)"></td>
    <td><input type="checkbox" ${fechas[3]?'checked':''} disabled onchange="guardarFila(this)"></td>
    <td><button onclick="borrarFila(this)">🗑️</button></td>
  `;
  
  // Guardar automáticamente en Firestore con ID único
  if(nombre.trim()) {
    db.collection("participantes").doc(rowId).set({
      nombre, asistencia, fechas
    }).then(()=> updateTotals())
      .catch(err=> console.error(err));
  }

  updateTotals();
}

// Modificar unlockButtons para agregar participantes con ID único
function unlockButtons(){
  const input = document.getElementById("clave");
  if(input.value === CLAVE){
    document.getElementById("buttons").classList.remove("hidden");
    alert("✅ Botones desbloqueados. Se cargarán los participantes predefinidos.");
    input.value = "";
    participantesLista.forEach(nombre => addRow(nombre));
  } else {
    alert("❌ Clave incorrecta");
  }
}

// Actualiza totales y colores de progreso
function updateTotals() {
  const tbody = document.getElementById("tableBody");
  const rows = tbody.rows;
  let totalAsistentes = 0;
  let totalFechas = [0,0,0,0];

  for (let i = 0; i < rows.length; i++) {
    const row = rows[i];
    const select = row.cells[2].querySelector("select");
    const checkboxes = Array.from(row.querySelectorAll('input[type="checkbox"]'));
    const nombreInput = row.cells[1].querySelector('input[type="text"]');

    row.style.opacity = nombreInput.value.trim() ? 1 : 0.6;

    if (select.value === "Sí") {
      checkboxes.forEach(cb => cb.disabled = false);
      row.classList.add('si'); row.classList.remove('no');
    } else if (select.value === "No") {
      checkboxes.forEach(cb => { cb.checked = false; cb.disabled = true; });
      row.classList.add('no'); row.classList.remove('si');
    } else {
      checkboxes.forEach(cb => { cb.checked = false; cb.disabled = true; });
      row.classList.remove('si'); row.classList.remove('no');
    }

    if (select.value === "Sí") {
      totalAsistentes++;
      checkboxes.forEach((cb, idx) => { if(cb.checked) totalFechas[idx]++; });
    }

    row.cells[0].textContent = i+1;
  }

  document.getElementById("totalAsistentes").textContent = totalAsistentes;
  for (let j=0;j<4;j++){
    let pct = totalAsistentes ? Math.round(totalFechas[j]/totalAsistentes*100) : 0;
    let fill = document.getElementById("totalFecha"+(j+1));
    fill.style.width = pct + "%";
    fill.textContent = pct + "%";
    fill.style.background = pct < 40 ? "#f44336" : pct < 70 ? "#ff9800" : "#4caf50";
  }
}

// Añade un participante
function addRow(nombre="", asistencia="", fechas=[false,false,false,false], id=null){
  const tbody = document.getElementById("tableBody");
  const newRow = tbody.insertRow();
  newRow.innerHTML = `
    <td>0</td>
    <td><input type="text" value="${nombre}" oninput="guardarFila(this)"></td>
    <td>
      <select onchange="guardarFila(this)">
        <option value="">--</option>
        <option value="Sí" ${asistencia==='Sí'?'selected':''}>Sí</option>
        <option value="No" ${asistencia==='No'?'selected':''}>No</option>
      </select>
    </td>
    <td><input type="checkbox" ${fechas[0]?'checked':''} disabled onchange="guardarFila(this)"></td>
    <td><input type="checkbox" ${fechas[1]?'checked':''} disabled onchange="guardarFila(this)"></td>
    <td><input type="checkbox" ${fechas[2]?'checked':''} disabled onchange="guardarFila(this)"></td>
    <td><input type="checkbox" ${fechas[3]?'checked':''} disabled onchange="guardarFila(this)"></td>
    <td><button onclick="borrarFila(this)">🗑️</button></td>
  `;
  newRow.dataset.id = id || ""; // guardar id de Firestore
  updateTotals();
}

// Guardar cambios de una fila en Firebase
function guardarFila(el){
  const row = el.closest("tr");
  const nombre = row.cells[1].querySelector("input").value;
  if(!nombre.trim()) return;

  const asistencia = row.cells[2].querySelector("select").value;
  const fechas = Array.from(row.querySelectorAll('input[type="checkbox"]')).map(cb=>cb.checked);

  // Guardar en Firestore
  const id = row.dataset.id || nombre; // si no hay id, usar nombre
  row.dataset.id = id;
  db.collection("participantes").doc(id).set({
    nombre, asistencia, fechas
  }).then(()=> updateTotals())
    .catch(err=> console.error(err));
}

// Borrar fila y eliminar de Firebase
function borrarFila(btn){
  const row = btn.closest("tr");
  const id = row.dataset.id;
  if(id) db.collection("participantes").doc(id).delete().catch(console.error);
  row.remove();
  updateTotals();
}

// Cargar datos desde Firebase en tiempo real
db.collection("participantes").orderBy("nombre").onSnapshot(snapshot=>{
  const tbody = document.getElementById("tableBody");
  tbody.innerHTML = "";
  snapshot.forEach(doc=>{
    const data = doc.data();
    addRow(data.nombre, data.asistencia, data.fechas, doc.id);
  });
});
