<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cuestionario de Asistencia Interactivo</title>
<style>
body { font-family: Arial, sans-serif; background: #f0f4f8; padding: 20px; text-align: center; }
h2 { color: #333; margin-bottom: 10px; }
.table-container { max-width: 1000px; margin: 20px auto; overflow: auto; background: #fff; box-shadow: 0 6px 20px rgba(0,0,0,0.1); border-radius: 12px; padding: 15px; }
table { border-collapse: collapse; width: 100%; }
th, td { border: 1px solid #ccc; padding: 8px; text-align: center; }
th { background: #e2e2e2; font-weight: bold; position: sticky; top: 0; z-index: 2; }
.totales { font-weight: bold; background: #d0ebff; position: sticky; top: 40px; z-index: 1; }
tr:nth-child(even) td { background: #f9f9f9; }
.si { background-color: #d4edda; transition: background 0.3s; }
.no { background-color: #f8d7da; transition: background 0.3s; }
input[type="text"] { width: 100%; box-sizing: border-box; padding: 4px; border-radius: 4px; border: 1px solid #ccc; }
select { width: 70px; padding: 2px; border-radius: 4px; }
.progress-bar { height: 18px; border-radius: 10px; background: #e2e2e2; overflow: hidden; margin-top: 4px; }
.progress-fill { height: 100%; width: 0%; background: #4caf50; text-align: center; color: white; font-size: 12px; line-height: 18px; transition: width 0.5s, background 0.5s; }
.hidden { display: none; }
</style>
</head>
<body>

<h2>Colegio San Antonio de Padua. Cáceres</h2>
<h2>COU 1975 - 50 Aniversario</h2>
<h2>Confirmación de asistencia y fechas</h2>

<div class="table-container">
<table id="asistenciaTable">
  <thead>
    <tr>
      <th>#</th>
      <th>Nombre</th>
      <th>Asistencia</th>
      <th>Fecha 1</th>
      <th>Fecha 2</th>
      <th>Fecha 3</th>
      <th>Fecha 4</th>
    </tr>
    <tr class="totales">
      <td>—</td>
      <td>Totales</td>
      <td id="totalAsistentes">0</td>
      <td><div class="progress-bar"><div class="progress-fill" id="totalFecha1">0%</div></div></td>
      <td><div class="progress-bar"><div class="progress-fill" id="totalFecha2">0%</div></div></td>
      <td><div class="progress-bar"><div class="progress-fill" id="totalFecha3">0%</div></div></td>
      <td><div class="progress-bar"><div class="progress-fill" id="totalFecha4">0%</div></div></td>
    </tr>
  </thead>
  <tbody id="tableBody"></tbody>
</table>
</div>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<script>
// Firebase configuration (solo con projectId para no exponer claves)
const firebaseConfig = {
  projectId: "asistencia-cou1975"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// Lista de participantes
const participantes = [
"Luisa Fernanda Alía Sánchez","Catalina Amador Campos","Tomás Barroso Gracia","Fátima Barroso Gutiérrez",
"Pilar Barroso Gutiérrez","Inés María Bravo Mogollón","Alfonso Callejo Carbajo","Gonzalo Callejo Carbajo",
"Fidela Calvarro Acosta","Gabriel Candela Maeztu","María Ángeles Carrasco Mayoral","Francisco José Corrales Corrales",
"María Luisa Crespo Candela","Antonio  De Manuel Carrasco","Enrique Fernández Cañadas","Carmen Fernández Sánchez",
"Manuel Floriano Cortés","Mercedes Floriano Fernández","Santos Floriano Fernández","Antonio  Galea Martín",
"Magdalena García Gutiérrez","Marta  García Martínez","Soledad García Martínez","Carlos García Villalón",
"Juan Manuel  García-Agúndez","Elvira  Gómez Martín","Sebastián Gómez Rivera","Germán González Floriano",
"Pilar Guerrero Cantón","Francisco José Hernández Mogollón","Herminia Hernández Pelayo","Jesús Hernández Terrón",
"Plácida Jiménez Villa","Francisco León Duque","José Lucio Campos","Candelas  Luengo García","José Luis  Madrigal López",
"Magdalena Márquez Fragoso","Pelayo Mellado Jiménez","Joaquín Municio Durán","Eufemia Muñoz Carrasco",
"Purificación Muriel González","Purificación Muriel Rincón","Jesús Nevado Carrero","Pilar Ortega Sánchez",
"Elías Palomares Carrón","Santiago Paniagua Sandín","José Alfonso Pañero San Juan","María Teresa  Paradés Regodón",
"Jesús Peloche Ortega","María Victoria Pérez Aloe Mejías","Arturo Pérez Hernández","María Isabel Pérez Hernández",
"Socorro  Plaza Mateos","María José Polo Macías","Mercedes Preciado Lebrón","Soledad Pulido Iglesias",
"Santiago  Ramos Pascual","Juan Ramos Salado","Rosa Rodríguez Corrales","Juan Carlos Román García",
"Inés María Sáez Rey","Basilio Sánchez González","Carlos  Sánchez Solana","Juan José Santos Palomo",
"José Luis  Silos Muñoz","Luis Tobajas Pizarro","Martín Valverde Merino","Emiliano Vivas Jiménez"
];

// ===== Funciones =====

// Actualiza totales y colores de progreso
function updateTotals() {
  const tbody = document.getElementById("tableBody");
  const rows = tbody.rows;
  let totalAsistentes = 0;
  let totalFechas = [0,0,0,0];

  for (let i = 0; i < rows.length; i++) {
    const row = rows[i];
    const select = row.cells[2].querySelector("select");
    const checkboxes = Array.from(row.querySelectorAll('input[type="checkbox"]'));
    const nombreInput = row.cells[1].querySelector('input[type="text"]');

    row.style.opacity = nombreInput.value.trim() ? 1 : 0.6;

    if (select.value === "Sí") {
      checkboxes.forEach(cb => cb.disabled = false);
      row.classList.add('si'); row.classList.remove('no');
    } else if (select.value === "No") {
      checkboxes.forEach(cb => { cb.checked = false; cb.disabled = true; });
      row.classList.add('no'); row.classList.remove('si');
    } else {
      checkboxes.forEach(cb => { cb.checked = false; cb.disabled = true; });
      row.classList.remove('si'); row.classList.remove('no');
    }

    if (select.value === "Sí") {
      totalAsistentes++;
      checkboxes.forEach((cb, idx) => { if(cb.checked) totalFechas[idx]++; });
    }

    row.cells[0].textContent = i+1;
  }

  document.getElementById("totalAsistentes").textContent = totalAsistentes;
  for (let j=0;j<4;j++){
    let pct = totalAsistentes ? Math.round(totalFechas[j]/totalAsistentes*100) : 0;
    let fill = document.getElementById("totalFecha"+(j+1));
    fill.style.width = pct + "%";
    fill.textContent = pct + "%";
    fill.style.background = pct < 40 ? "#f44336" : pct < 70 ? "#ff9800" : "#4caf50";
  }
}

// Añade un participante
function addRow(nombre="", asistencia="", fechas=[false,false,false,false], id=null){
  const tbody = document.getElementById("tableBody");
  const newRow = tbody.insertRow();
  newRow.innerHTML = `
    <td>0</td>
    <td><input type="text" value="${nombre}" oninput="guardarFila(this)"></td>
    <td>
      <select onchange="guardarFila(this)">
        <option value="">--</option>
        <option value="Sí" ${asistencia==='Sí'?'selected':''}>Sí</option>
        <option value="No" ${asistencia==='No'?'selected':''}>No</option>
      </select>
    </td>
    <td><input type="checkbox" ${fechas[0]?'checked':''} disabled onchange="guardarFila(this)"></td>
    <td><input type="checkbox" ${fechas[1]?'checked':''} disabled onchange="guardarFila(this)"></td>
    <td><input type="checkbox" ${fechas[2]?'checked':''} disabled onchange="guardarFila(this)"></td>
    <td><input type="checkbox" ${fechas[3]?'checked':''} disabled onchange="guardarFila(this)"></td>
  `;
  newRow.dataset.id = id || nombre;
  updateTotals();
}

// Guardar cambios de una fila en Firebase sin borrar otros datos
function guardarFila(el){
  const row = el.closest("tr");
  const id = row.dataset.id || db.collection("participantes").doc().id;
  row.dataset.id = id;

  const nombre = row.cells[1].querySelector("input").value.trim();
  const asistencia = row.cells[2].querySelector("select").value;
  const fechas = Array.from(row.querySelectorAll('input[type="checkbox"]')).map(cb => cb.checked);

  db.collection("participantes").doc(id).set({
    nombre, asistencia, fechas
  }, { merge: true });

  updateTotals();
}

// Carga inicial de participantes
async function cargarParticipantes(){
  const snapshot = await db.collection("participantes").get();
  const existing = snapshot.docs.map(d=>d.data().nombre);

  // Cargar desde Firebase
  snapshot.docs.forEach(doc=>{
    const data = doc.data();
    addRow(data.nombre, data.asistencia, data.fechas, doc.id);
  });

  // Añadir los que falten
  participantes.forEach(nombre=>{
    if(!existing.includes(nombre)){
      addRow(nombre,"",[false,false,false,false], nombre);
      db.collection("participantes").doc(nombre).set({
        nombre, asistencia:"", fechas:[false,false,false,false]
      }, { merge:true });
    }
  });

  updateTotals();
}

// Inicialización
window.onload = () => cargarParticipantes();
</script>
</body>
</html>
