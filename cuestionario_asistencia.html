<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cuestionario de Asistencia Interactivo</title>
<style>
body { font-family: Arial, sans-serif; background: #f0f4f8; padding: 20px; text-align: center; }
h2 { color: #333; margin-bottom: 10px; }
.table-container { max-width: 1000px; margin: 20px auto; overflow: auto; background: #fff; box-shadow: 0 6px 20px rgba(0,0,0,0.1); border-radius: 12px; padding: 15px; }
table { border-collapse: collapse; width: 100%; }
th, td { border: 1px solid #ccc; padding: 8px; text-align: center; }
th { background: #e2e2e2; font-weight: bold; position: sticky; top: 0; z-index: 2; }
.totales { font-weight: bold; background: #d0ebff; position: sticky; top: 40px; z-index: 1; }
tr:nth-child(even) td { background: #f9f9f9; }
.si { background-color: #d4edda; transition: background 0.3s; }
.no { background-color: #f8d7da; transition: background 0.3s; }
input[type="text"] { width: 100%; box-sizing: border-box; padding: 4px; border-radius: 4px; border: 1px solid #ccc; }
select { width: 70px; padding: 2px; border-radius: 4px; }
.button-group { margin: 15px 0; }
button { margin: 0 10px; padding: 6px 12px; cursor: pointer; border-radius: 6px; border: none; background: #007bff; color: white; font-weight: bold; transition: background 0.3s; }
button:hover { background: #0056b3; }
.progress-bar { height: 18px; border-radius: 10px; background: #e2e2e2; overflow: hidden; margin-top: 4px; }
.progress-fill { height: 100%; width: 0%; background: #4caf50; text-align: center; color: white; font-size: 12px; line-height: 18px; transition: width 0.5s, background 0.5s; }
.hidden { display: none; }
</style>
</head>
<body>
<h2>Colegio San Antonio de Padua. Cáceres</h<br>
<h2>COU 1975 - 50 Aniversario</h<br>
<h2>Confirmación de asistencia y fechas</h2>

<div class="button-group hidden" id="buttons">
  <button onclick="addRow()">➕ Agregar participante</button>
  <button onclick="exportCSV()">💾 Exportar CSV</button>
</div>

<div>
  <input type="password" id="clave" placeholder="Ingrese la clave para desbloquear" onkeypress="if(event.key==='Enter'){unlockButtons();}">
  <button onclick="unlockButtons()">🔓 Desbloquear</button>
</div>

<div class="table-container">
<table id="asistenciaTable">
  <thead>
    <tr>
      <th>#</th>
      <th>Nombre</th>
      <th>Asistencia</th>
      <th>Fecha 1</th>
      <th>Fecha 2</th>
      <th>Fecha 3</th>
      <th>Fecha 4</th>
    </tr>
  </thead>
  <tbody id="tableBody">
    <tr class="totales">
      <td>—</td>
      <td>Totales</td>
      <td id="totalAsistentes">0</td>
      <td><div class="progress-bar"><div class="progress-fill" id="totalFecha1">0%</div></div></td>
      <td><div class="progress-bar"><div class="progress-fill" id="totalFecha2">0%</div></div></td>
      <td><div class="progress-bar"><div class="progress-fill" id="totalFecha3">0%</div></div></td>
      <td><div class="progress-bar"><div class="progress-fill" id="totalFecha4">0%</div></div></td>
    </tr>
  </tbody>
</table>
</div>

<script>
const CLAVE = "1234";

function unlockButtons(){
  const input = document.getElementById("clave");
  if(input.value === CLAVE){
    document.getElementById("buttons").classList.remove("hidden");
    alert("✅ Botones desbloqueados");
    input.value = "";
  } else {
    alert("❌ Clave incorrecta");
  }
}

function updateTotals() {
  const tbody = document.getElementById("tableBody");
  const rows = tbody.rows;
  let totalAsistentes = 0;
  let totalFechas = [0,0,0,0];

  for (let i = 1; i < rows.length; i++) {
    const row = rows[i];
    const select = row.cells[2].querySelector("select");
    const checkboxes = Array.from(row.querySelectorAll('input[type="checkbox"]'));
    const nombreInput = row.cells[1].querySelector('input[type="text"]');

    row.style.opacity = nombreInput.value.trim() ? 1 : 0.6;

    if (select.value === "sí") {
      checkboxes.forEach(cb => cb.disabled = false);
      row.classList.add('si'); row.classList.remove('no');
    } else if (select.value === "no") {
      checkboxes.forEach(cb => { cb.checked = false; cb.disabled = true; });
      row.classList.add('no'); row.classList.remove('si');
    } else {
      checkboxes.forEach(cb => { cb.checked = false; cb.disabled = true; });
      row.classList.remove('si'); row.classList.remove('no');
    }

    if (select.value === "sí") {
      totalAsistentes++;
      checkboxes.forEach((cb, idx) => { if(cb.checked) totalFechas[idx]++; });
    }

    row.cells[0].textContent = i;
  }

  document.getElementById("totalAsistentes").textContent = totalAsistentes;

  for (let j=0;j<4;j++){
    let pct = totalAsistentes ? Math.round(totalFechas[j]/totalAsistentes*100) : 0;
    let fill = document.getElementById("totalFecha"+(j+1));
    fill.style.width = pct + "%";
    fill.textContent = pct + "%";
    if(pct < 40) fill.style.background = "#f44336";
    else if(pct < 70) fill.style.background = "#ff9800";
    else fill.style.background = "#4caf50";
  }

  saveData(); // guardar cada vez que se actualiza
}

function addRow(name="", asistencia="", fechas=[false,false,false,false]) {
  const tbody = document.getElementById("tableBody");
  const newRow = tbody.insertRow();
  newRow.innerHTML = `
    <td>0</td>
    <td><input type="text" value="${name}" oninput="updateTotals()"></td>
    <td>
      <select onchange="updateTotals(this)">
        <option value="">--</option>
        <option value="sí" ${asistencia==='sí'?'selected':''}>sí</option>
        <option value="no" ${asistencia==='no'?'selected':''}>no</option>
      </select>
    </td>
    <td><input type="checkbox" ${fechas[0]?'checked':''} disabled onchange="updateTotals()"></td>
    <td><input type="checkbox" ${fechas[1]?'checked':''} disabled onchange="updateTotals()"></td>
    <td><input type="checkbox" ${fechas[2]?'checked':''} disabled onchange="updateTotals()"></td>
    <td><input type="checkbox" ${fechas[3]?'checked':''} disabled onchange="updateTotals()"></td>
  `;
  updateTotals();
}

function exportCSV() {
  const rows = document.querySelectorAll("#asistenciaTable tr");
  let csv = [];
  rows.forEach(row => {
    const cols = row.querySelectorAll("td, th");
    let rowData = [];
    cols.forEach(col => {
      if(col.querySelector("input[type='text']")){
        rowData.push('"' + col.querySelector("input[type='text']").value + '"');
      } else if(col.querySelector("select")){
        rowData.push(col.querySelector("select").value);
      } else if(col.querySelector("input[type='checkbox']")){
        rowData.push(col.querySelector("input[type='checkbox']").checked ? "sí" : "no");
      } else {
        rowData.push(col.textContent.trim());
      }
    });
    csv.push(rowData.join(","));
  });

  const csvFile = new Blob([csv.join("\n")], {type: "text/csv"});
  const downloadLink = document.createElement("a");
  downloadLink.download = "asistencia_dashboard.csv";
  downloadLink.href = window.URL.createObjectURL(csvFile);
  downloadLink.style.display = "none";
  document.body.appendChild(downloadLink);
  downloadLink.click();
  document.body.removeChild(downloadLink);
}

function saveData() {
  const tbody = document.getElementById("tableBody");
  const rows = Array.from(tbody.rows).slice(1); // sin fila totales
  const data = rows.map(row => {
    const nombre = row.cells[1].querySelector("input").value;
    const asistencia = row.cells[2].querySelector("select").value;
    const fechas = Array.from(row.querySelectorAll("input[type='checkbox']")).map(cb=>cb.checked);
    return {nombre, asistencia, fechas};
  });
  localStorage.setItem("asistenciaData", JSON.stringify(data));
}

function loadData() {
  const data = JSON.parse(localStorage.getItem("asistenciaData") || "[]");
  data.forEach(d => addRow(d.nombre,d.asistencia,d.fechas));
}

window.onload = function(){
  loadData();
  updateTotals();
};
</script>

</body>
</html>
